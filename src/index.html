<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rikkle</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Rikkle is an immersive 3D cylindrical puzzle matching game. Rotate cylinder rings left or right to line up 3 or more matching colors or symbols vertically, horizontally, or in L-shapes, and tap to clear them, score points, and earn bonus moves!"
    />
    <meta name="theme-color" content="#1a1a2e" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Favicons -->

    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Apple iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rikkle" />
    <link rel="apple-touch-icon" href="icons/ios/180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="icons/ios/152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="icons/ios/167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/ios/180.png" />

    <meta name="msapplication-TileColor" content="#1a1a2e" />
