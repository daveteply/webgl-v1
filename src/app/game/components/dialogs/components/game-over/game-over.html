<div id="game-over" class="glass-dialog">
  <h1 class="text-center">No More Moves</h1>
  <mat-dialog-content>
    <p class="game-over-emoji">{{ gameOverEmoji() }}</p>
    <p class="text-center">You have exhausted your supply of moves!</p>
    <wgl-progress-bar
      class="progress"
      [class.fade-out]="!texturesStillLoading()"
      [value]="progress()"
    ></wgl-progress-bar>
    <wgl-high-scores></wgl-high-scores>
  </mat-dialog-content>
  <mat-dialog-actions align="center">
    @if (!isLevelOne()) {
      <button mat-raised-button color="primary" [disabled]="texturesStillLoading()" (click)="onCloseRestartLevel()">
        Start Level {{ data.level }} again
      </button>

      @if (!confirmStartOver()) {
        <button mat-stroked-button color="warn" [disabled]="texturesStillLoading()" (click)="onCloseGameOver()">
          Start Over
        </button>
      }

      <mat-expansion-panel [expanded]="confirmStartOver()" hideToggle class="start-over-expansion-panel">
        <div class="confirm-container">
          <span class="confirm-prompt">
            ⚠️ Are you sure? You will lose your current <strong>Level {{ data.level }}</strong> run and progress!
          </span>
          <div class="confirm-buttons">
            <button mat-button (click)="onCancelStartOver()">Cancel</button>
            <button mat-raised-button color="warn" (click)="onConfirmStartOver()">Yes, Start Over</button>
          </div>
        </div>
      </mat-expansion-panel>
    } @else {
      <button mat-raised-button color="primary" [disabled]="texturesStillLoading()" (click)="onCloseGameOver()">
        <span>Play again!</span>
      </button>
    }
  </mat-dialog-actions>
</div>
