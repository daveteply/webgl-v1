<div id="intro-dialog" class="glass-dialog has-canvas-animation">
  <canvas #dialogCanvas class="canvas-backer"></canvas>
  <div class="logo"></div>
  <div class="version-label">{{ appVersion }}</div>

  <mat-dialog-content class="content">
    <wgl-high-scores [showHighligh]="false"></wgl-high-scores>
    <wgl-progress-bar class="progress" [class.fade-out]="!materialsUpdating()" [value]="progress()"></wgl-progress-bar>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <div class="dialog-buttons">
      <button mat-raised-button color="primary" mat-dialog-close [disabled]="materialsUpdating()">
        <span>New Game</span>
      </button>
      @if (hasRestoreData()) {
        <button (click)="RestoreGame()" mat-stroked-button [disabled]="materialsUpdating()">
          <span>Continue</span>
        </button>
      }
    </div>
  </mat-dialog-actions>
</div>
