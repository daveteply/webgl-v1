<div id="save-game-confirm" class="glass-dialog">
  <h2 class="dialog-title text-center">Save & Exit</h2>
  <div mat-dialog-content class="content-body text-center">
    <p>Saving will store your current level progress and return to the main menu.</p>
    <p>Do you wish to continue?</p>
  </div>
  <div mat-dialog-actions align="center" class="dialog-actions">
    <button mat-stroked-button color="primary" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" (click)="onConfirmSave()">Save & Exit</button>
  </div>
</div>
