<div id="how-to-play" class="glass-dialog">
  <div mat-dialog-title>
    <span class="title">How to Play</span>
  </div>
  <div class="content" mat-dialog-content>
    <div class="instructions-list">
      <div class="instruction-item">
        <span class="step-icon">
          <span class="arrow">{{ leftArrow }}</span
          ><span class="arrow">{{ rightArrow }}</span>
        </span>
        <span><strong>Rotate Horizontally:</strong> Swipe rows left or right to line up matching pieces.</span>
      </div>
      <div class="instruction-item">
        <span class="step-icon">👆</span>
        <span><strong>Match & Clear:</strong> Tap 3+ matching pieces to score!</span>
      </div>
    </div>
  </div>
  <div mat-dialog-actions align="center">
    <button mat-raised-button color="primary" mat-dialog-close>Got It!</button>
  </div>
</div>
