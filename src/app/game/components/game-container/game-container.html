<div
  class="splash-screen"
  [class.phase-image]="splashPhase() === 'image'"
  [class.phase-fade-out]="splashPhase() === 'fade-out'"
  [class.phase-done]="splashPhase() === 'done'"
>
  <div class="splash-black-cover"></div>
  <div class="splash-image-cover"></div>
</div>

<div class="game-layout">
  <div class="game-scoring" [class.show]="showScoreProgress()">
    <div class="game-logo"></div>
    <wgl-text-zoom class="game-score" [text]="scoringManager.Score"></wgl-text-zoom>
    <wgl-moves-left class="moves-remaining" [amount]="scoringManager.PlayerMoves"></wgl-moves-left>
    <div class="level-info" [style.color]="LevelLabelColor">
      <span>Level</span>
      <span>&nbsp;</span>
      <div>{{ scoringManager.Level }}</div>
    </div>
  </div>
  <div class="game">
    <canvas class="game-canvas" #gameCanvas></canvas>
  </div>
  <wgl-share-content
    class="docked-share-tab"
    [class.show]="showScoreProgress()"
  ></wgl-share-content>
  <div class="game-footer" [class.show]="showScoreProgress()">
    <div class="level-progress">
      <div class="level-progress--percent">{{ scoringManager.LevelProgress | number: '1.0-0' }}%</div>
      <wgl-progress-bar [value]="scoringManager.LevelProgress" [remaining]="scoringManager.PiecesRemaining">
      </wgl-progress-bar>
    </div>
    <wgl-game-menu></wgl-game-menu>
  </div>
  <div
    class="copyright"
    [class.show]="splashPhase() !== 'black' && !showScoreProgress()"
    [class.hide]="showScoreProgress()"
  >
    &copy; {{ copyrightYear }} David Teply
  </div>
</div>
