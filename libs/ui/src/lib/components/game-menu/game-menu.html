<div id="game-menu">
  <button mat-fab color="primary" class="menu-cta" [class.show]="shareManager.InLevel" [matMenuTriggerFor]="menu">
    <mat-icon>menu</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <div class="menu-version-header">
      <span>{{ 'MENU.VERSION' | transloco: { version: appVersion } }}</span>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="AboutClick()">
      <mat-icon>info</mat-icon><span>{{ 'MENU.ABOUT_LEVEL' | transloco }}</span>
    </button>
    <button mat-menu-item (click)="SettingsClick()">
      <mat-icon>settings</mat-icon><span>{{ 'MENU.SETTINGS' | transloco }}</span>
    </button>
    <button mat-menu-item (click)="InstallAppClick()">
      <mat-icon>get_app</mat-icon><span>{{ 'MENU.ADD_TO_HOME' | transloco }}</span>
    </button>
  </mat-menu>
</div>
