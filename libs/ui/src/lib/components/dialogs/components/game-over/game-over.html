<div id="game-over" class="glass-dialog">
  <h1 class="text-center">{{ 'GAME_OVER.TITLE' | transloco }}</h1>
  <mat-dialog-content>
    <p class="game-over-emoji">{{ gameOverEmoji() }}</p>
    <p class="text-center">{{ 'GAME_OVER.MESSAGE' | transloco }}</p>
    <wgl-progress-bar
      class="progress"
      [class.fade-out]="!texturesStillLoading()"
      [value]="progress()"
    ></wgl-progress-bar>
    <wgl-high-scores></wgl-high-scores>
  </mat-dialog-content>
  <mat-dialog-actions align="center">
    @if (!isLevelOne()) {
      <button mat-raised-button color="primary" [disabled]="texturesStillLoading()" (click)="onCloseRestartLevel()">
        {{ 'GAME_OVER.START_LEVEL_AGAIN' | transloco: { level: data.level } }}
      </button>

      @if (!confirmStartOver()) {
        <button mat-stroked-button color="warn" [disabled]="texturesStillLoading()" (click)="onCloseGameOver()">
          {{ 'GAME_OVER.START_OVER' | transloco }}
        </button>
      }

      <mat-expansion-panel [expanded]="confirmStartOver()" hideToggle class="start-over-expansion-panel">
        <div class="confirm-container">
          <span class="confirm-prompt">
            {{ 'GAME_OVER.CONFIRM_START_OVER' | transloco: { level: data.level } }}
          </span>
          <div class="confirm-buttons">
            <button mat-button (click)="onCancelStartOver()">{{ 'GAME_OVER.CANCEL' | transloco }}</button>
            <button mat-raised-button color="warn" (click)="onConfirmStartOver()">
              {{ 'GAME_OVER.YES_START_OVER' | transloco }}
            </button>
          </div>
        </div>
      </mat-expansion-panel>
    } @else {
      <button mat-raised-button color="primary" [disabled]="texturesStillLoading()" (click)="onCloseGameOver()">
        <span>{{ 'GAME_OVER.PLAY_AGAIN' | transloco }}</span>
      </button>
    }
  </mat-dialog-actions>
</div>
