<div id="intro-dialog" class="glass-dialog has-canvas-animation">
  <canvas #dialogCanvas class="canvas-backer"></canvas>
  <div class="logo"></div>
  <div class="version-label">{{ appVersion }}</div>

  <mat-dialog-content class="content">
    <wgl-high-scores [showHighligh]="false"></wgl-high-scores>
    <wgl-progress-bar class="progress" [class.fade-out]="!materialsUpdating()" [value]="progress()"></wgl-progress-bar>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <div class="dialog-buttons">
      @if (hasRestoreData()) {
        <button
          (click)="ContinueGame()"
          mat-raised-button
          color="primary"
          class="continue-btn"
          [disabled]="materialsUpdating()"
        >
          <span>{{ 'INTRO.CONTINUE_GAME' | transloco: { level: savedLevel() } }}</span>
        </button>

        @if (!confirmNewGame()) {
          <button (click)="onNewGameClick()" mat-stroked-button class="new-game-btn" [disabled]="materialsUpdating()">
            <span>{{ 'INTRO.NEW_GAME' | transloco }}</span>
          </button>
        }

        <mat-expansion-panel [expanded]="confirmNewGame()" hideToggle class="new-game-expansion-panel">
          <div class="confirm-container">
            <span class="confirm-prompt">
              {{ 'INTRO.CONFIRM_NEW_GAME' | transloco: { level: savedLevel() } }}
            </span>
            <div class="confirm-buttons">
              <button mat-button (click)="onCancelNewGame()">{{ 'SETTINGS.CANCEL' | transloco }}</button>
              <button mat-raised-button color="warn" (click)="onConfirmNewGame()">
                {{ 'INTRO.START_NEW_GAME' | transloco }}
              </button>
            </div>
          </div>
        </mat-expansion-panel>
      } @else {
        <button
          (click)="onNewGameClick()"
          mat-raised-button
          color="primary"
          class="new-game-btn"
          [disabled]="materialsUpdating()"
        >
          <span>{{ 'INTRO.NEW_GAME' | transloco }}</span>
        </button>
      }
    </div>
  </mat-dialog-actions>
</div>
