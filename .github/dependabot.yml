version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      angular:
        patterns:
          - '@angular/*'
      nx:
        patterns:
          - '@nx/*'
          - 'nx'
      devDependencies:
        dependency-type: 'development'
        exclude-patterns:
          - '@angular/*'
          - '@nx/*'
